name: Daily LQD/IEF circuit breaker check

# Triggered daily by Cloudflare Workers cron (see deploy/cf-cron/).
# STATELESS: computes today's and yesterday's NDX LQD/IEF circuit state
# on the fly from full sleeve history. Sends Telegram alert ONLY on
# day-over-day state change.

on:
  schedule:
    - cron: "0 22 * * *"  # 22:00 UTC daily (post US close)
  workflow_dispatch:
  repository_dispatch:
    types: [circuit-check]

permissions:
  contents: read

concurrency:
  group: circuit-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Refresh NDX constituent panel
        # NDX panel is gitignored (~70 MB); refresh from yfinance each run.
        # ~30s for ~100 active tickers.
        run: uv run python -c "from ndx_sleeve_live import refresh_ndx_panel; refresh_ndx_panel()"

      - name: Run LQD/IEF circuit check
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DASHBOARD_URL: https://cpm-bull-dashboard.pages.dev
        run: uv run python circuit_check.py

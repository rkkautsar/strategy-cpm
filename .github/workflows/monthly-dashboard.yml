name: Monthly TAA dashboard

on:
  schedule:
    # 02:17 UTC on the 4th is 9:17 PM EST / 10:17 PM EDT on the 3rd in New York.
    # Running off the hour reduces GitHub scheduled-run contention.
    - cron: "17 2 4 * *"
  workflow_dispatch:
    inputs:
      notification_email:
        description: "Optional: send the allocation only to this active subscription"
        required: false
        type: string
      send_all_notifications:
        description: "Send this month's allocation to every eligible subscriber"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: monthly-taa-dashboard
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONUNBUFFERED: "1"
      CPM_REQUIRE_R2: "1"
      CPM_REQUIRE_FRESH_DATA: "1"
      CPM_R2_BUCKET: ${{ secrets.CPM_R2_BUCKET }}
      CPM_R2_ACCOUNT_ID: ${{ secrets.CPM_R2_ACCOUNT_ID }}
      CPM_R2_ACCESS_KEY_ID: ${{ secrets.CPM_R2_ACCESS_KEY_ID }}
      CPM_R2_SECRET_ACCESS_KEY: ${{ secrets.CPM_R2_SECRET_ACCESS_KEY }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      VALUEIN_API_KEY: ${{ secrets.VALUEIN_API_KEY }}
      NOTIFICATION_DISPATCH_TOKEN: ${{ secrets.NOTIFICATION_DISPATCH_TOKEN }}
      DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
      VALUEIN_MAX_PARTITION_DOWNLOADS: "100"
      CPM_MAX_PRICE_AGE_DAYS: "7"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --frozen --extra r2

      - name: Check scheduled email configuration
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.send_all_notifications || inputs.notification_email != ''))
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ vars.RESEND_FROM }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$NOTIFICATION_DISPATCH_TOKEN" || { echo "NOTIFICATION_DISPATCH_TOKEN is required for allocation email delivery."; exit 1; }
          test -n "$RESEND_API_KEY" || { echo "RESEND_API_KEY is required for allocation email delivery."; exit 1; }
          test -n "$RESEND_FROM" || { echo "RESEND_FROM is required for allocation email delivery."; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN is required to deploy the dashboard."; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "CLOUDFLARE_ACCOUNT_ID is required to deploy the dashboard."; exit 1; }

      - name: Update cached sources and build dashboard
        run: uv run taa-backtest --output results

      - name: Prepare static site
        run: |
          mkdir -p dist
          cp results/dashboard.html dist/index.html
          cp results/dashboard.html dist/dashboard.html
          printf 'User-agent: *\nDisallow:\n' > dist/robots.txt
          printf '{"version":1,"include":["/api/*"],"exclude":[]}' > dist/_routes.json

      - name: Configure Pages email credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ vars.RESEND_FROM }}
        run: |
          npm install --global wrangler@4
          printf '%s' "$RESEND_API_KEY" | wrangler pages secret put RESEND_API_KEY --project-name=cpm-bull-dashboard
          printf '%s' "$RESEND_FROM" | wrangler pages secret put RESEND_FROM --project-name=cpm-bull-dashboard

      - name: Deploy dashboard to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=cpm-bull-dashboard --commit-message="Monthly TAA dashboard ${{ github.run_number }}"

      - name: Email monthly allocations to blend subscribers
        if: github.event_name == 'schedule' || inputs.send_all_notifications || inputs.notification_email != ''
        env:
          NOTIFICATION_DISPATCH_TOKEN: ${{ secrets.NOTIFICATION_DISPATCH_TOKEN }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
        run: |
          SITE_URL="${DASHBOARD_URL:-https://cpm.rakha.dev}"
          TARGET_NOTIFICATION_EMAIL="$(jq -r '.inputs.notification_email // empty' "$GITHUB_EVENT_PATH")"
          SEND_ALL_NOTIFICATIONS="$(jq -r '.inputs.send_all_notifications // false' "$GITHUB_EVENT_PATH")"
          if [ -n "$TARGET_NOTIFICATION_EMAIL" ] && [ "$SEND_ALL_NOTIFICATIONS" = "true" ]; then
            echo "Choose a single recipient or all subscribers, not both."
            exit 2
          fi
          PAYLOAD_FILE=results/notification_data.json
          if [ -n "$TARGET_NOTIFICATION_EMAIL" ]; then
            echo "::add-mask::$TARGET_NOTIFICATION_EMAIL"
            PAYLOAD_FILE="$RUNNER_TEMP/notification_data.json"
            jq --arg target_email "$TARGET_NOTIFICATION_EMAIL" '. + {target_email: $target_email}' results/notification_data.json > "$PAYLOAD_FILE"
          fi
          for attempt in 1 2 3; do
            if curl --fail-with-body --silent --show-error \
              -X POST "${SITE_URL}/api/notifications/dispatch" \
              -H "Authorization: Bearer ${NOTIFICATION_DISPATCH_TOKEN}" \
              -H "Content-Type: application/json" \
              --data-binary "@$PAYLOAD_FILE"; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Allocation dispatch attempt $attempt failed; retrying in 15 seconds."
              sleep 15
            fi
          done
          exit 1

      - name: Keep monthly outputs
        uses: actions/upload-artifact@v4
        with:
          name: cpm-dashboard-${{ github.run_number }}
          path: results/
          retention-days: 90

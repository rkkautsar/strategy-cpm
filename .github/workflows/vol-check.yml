name: Daily vol-cap check

# Triggered daily by Cloudflare Workers cron (see deploy/cf-cron/).
# STATELESS: computes today's and yesterday's latched vol-cap scale on the
# fly from full history. Sends Telegram alert ONLY on day-over-day change
# (~0.9 events/year per backtest). No state file persisted.

on:
  repository_dispatch:
    types: [vol-check]
  workflow_dispatch:

permissions:
  contents: read  # stateless; nothing to commit

jobs:
  vol-check:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Refresh NDX constituent prices
        # vol_check needs ndx_panel; cache file isn't in repo. ~30s.
        run: uv run python -c "from ndx_sleeve_live import refresh_ndx_panel; refresh_ndx_panel()"

      - name: Run vol-cap check
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DASHBOARD_URL: https://cpm-bull-dashboard.pages.dev
        run: uv run python vol_check.py

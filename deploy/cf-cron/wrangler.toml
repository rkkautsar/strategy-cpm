name = "cpm-bull-cron"
main = "src/index.js"
compatibility_date = "2026-10-23"

[observability]
enabled = true
head_sampling_rate = 1

# These UTC hours cover 10 PM in New York across standard and daylight time.
# The Worker skips the hour that is not 10 PM locally.
[triggers]
crons = ["0 2,3 * * *"]

[vars]
GH_OWNER = "rkkautsar"
GH_REPO = "strategy-cpm"

name = "cpm-bull-cron"
main = "src/index.js"
compatibility_date = "2026-01-01"

# Cron trigger: 16:30 UTC on 1st-3rd of each month.
# Catches the case when 1st is a weekend (workflow itself is idempotent).
[triggers]
crons = ["30 16 1-3 * *"]

# Set GH_OWNER and GH_REPO to your values
[vars]
GH_OWNER = "your-github-username"
GH_REPO  = "strategy-cpm"

# Secrets (set via `wrangler secret put` -- never commit):
#   wrangler secret put GH_TOKEN
#   wrangler secret put TRIGGER_TOKEN
#
# GH_TOKEN: GitHub fine-grained PAT with `actions:write` on the target repo.
# TRIGGER_TOKEN: any random string, used to authenticate manual HTTP triggers.

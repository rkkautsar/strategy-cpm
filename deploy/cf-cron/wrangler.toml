name = "cpm-bull-cron"
main = "src/index.js"
compatibility_date = "2026-01-01"

# Monthly signal: 02:00 UTC, day 1 -> event_type=monthly-signal
#
# 02:00 UTC = 10:00 AM SGT (UTC+8). Signal date = last biz day of prior month.
# Signal close at 4 PM ET does not change over the weekend or overnight, so
# notification arriving 10 AM SGT on day 1 is valid for that month's signal.
[triggers]
crons = ["0 2 1 * *"]

[vars]
GH_OWNER = "rkkautsar"
GH_REPO  = "strategy-cpm"

# Secrets (set via `wrangler secret put` -- never commit):
#   wrangler secret put GH_TOKEN
#   wrangler secret put TRIGGER_TOKEN
#
# GH_TOKEN: GitHub fine-grained PAT with `actions:write` on the target repo.
# TRIGGER_TOKEN: any random string, used to authenticate manual HTTP triggers.

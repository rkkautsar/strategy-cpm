name = "cpm-bull-cron"
main = "src/index.js"
compatibility_date = "2026-01-01"

# Cron trigger: 02:00 UTC on day 1 of every month. Fires exactly 1x/month.
# 02:00 UTC = 10:00 AM SGT (UTC+8) = 10:00 PM / 9:00 PM ET prev evening.
#
# Strategy: signal date = last biz day of prior month. Signal close at 4 PM ET
# does not change over the weekend or overnight, so notification arriving
# Mon-Fri 10 AM SGT on day 1 is always valid for that month's signal. User
# (SGT) reads notification at breakfast and has the day to submit MOO orders
# for next US market open (= 9:30 PM SGT same day in summer / 10:30 PM winter).
#
# Edge case: month-end on Fri (Aug 29) means signal is 2.5 days old by Mon
# Sep 1 notification. That's fine — the signal didn't change over the weekend.
[triggers]
crons = ["0 2 1 * *"]

[vars]
GH_OWNER = "rkkautsar"
GH_REPO  = "strategy-cpm"

# Secrets (set via `wrangler secret put` -- never commit):
#   wrangler secret put GH_TOKEN
#   wrangler secret put TRIGGER_TOKEN
#
# GH_TOKEN: GitHub fine-grained PAT with `actions:write` on the target repo.
# TRIGGER_TOKEN: any random string, used to authenticate manual HTTP triggers.

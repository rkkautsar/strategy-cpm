name = "taa-dashboard-cron"
main = "src/index.js"
compatibility_date = "2026-10-23"

# Trigger at both possible UTC hours for 9 PM America/New_York on the 3rd.
# The Worker checks the local time, so only one cron dispatches in each month.
[triggers]
crons = ["0 1 4 * *", "0 2 4 * *"]

[vars]
GH_OWNER = "rkkautsar"
GH_REPO = "strategy-cpm"

# Configure secrets with `wrangler secret put GH_TOKEN` and
# `wrangler secret put TRIGGER_TOKEN`. GH_TOKEN needs Contents:write on this repo.

[project]
name = "strategy-cpm"
version = "0.1.0"
description = "CPM-NDX-VAL-RPV — 4-sleeve monthly TAA strategy"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "yfinance>=0.2",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "requests>=2.31",
    "lxml>=6.1.1",
    "pyarrow>=24.0.0",
]

[project.optional-dependencies]
dashboard = ["matplotlib>=3.7"]

[dependency-groups]
dev = [
    "index-constitution>=0.6.1",
    "pytest>=9.0.3",
    "pytest-regressions>=2.11.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
markers = [
    "slow: marks tests that run full golden-master backtest generation",
]



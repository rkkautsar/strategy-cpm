[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "taa-engine"
version = "0.1.0"
description = "A small tactical asset allocation backtest engine"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scipy>=1.11",
  "vectorbt>=0.26",
  "yfinance>=0.2.54",
  "index-constitution>=0.6.1,<1",
  "pyarrow>=26.0.0",
  "python-dotenv>=1.2.4",
]

[project.optional-dependencies]
r2 = ["boto3>=1.34"]

[project.scripts]
taa-backtest = "taa_engine.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["taa_engine*"]
